name: Setup fleet ACR metadata decoder
description: Build the trusted decoder once before reading consumer Git objects.

runs:
  using: composite
  steps:
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0; Renovate
      with:
        go-version-file: .github/codex-review/acr-metadata/go.mod
        cache-dependency-path: .github/codex-review/acr-metadata/go.sum
    - shell: bash
      working-directory: .github/codex-review/acr-metadata
      run: |
        set -euo pipefail
        decoder="$RUNNER_TEMP/acr-metadata"
        go vet -mod=readonly ./...
        go build -mod=readonly -o "$decoder" .
        printf 'ACR_METADATA_DECODER=%s\n' "$decoder" >> "$GITHUB_ENV"
