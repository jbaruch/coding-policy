name: Publish immutable ACR package
description: Publish the caller's clean explicit-version package through the canonical release owner.
inputs:
  path:
    description: Package repository root
    required: false
    default: '.'
  bin-directory:
    description: Optional directory containing the pinned acr executable
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Publish immutable tag and package
      shell: bash
      env:
        PACKAGE_ROOT: ${{ inputs.path }}
        ACR_BIN_DIRECTORY: ${{ inputs.bin-directory }}
      run: PATH="${ACR_BIN_DIRECTORY:+$ACR_BIN_DIRECTORY:}$PATH" bash "$GITHUB_ACTION_PATH/../../../skills/release/publish-acr.sh" "$PACKAGE_ROOT"
