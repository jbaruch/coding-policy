name: Setup language-diagnostics engines
description: >-
  Install pinned shellcheck and pyright — the headless engines behind the
  language-diagnostics gate (rules/language-diagnostics.md). Versions are
  pinned for reproducible findings (rules/dependency-management.md).

runs:
  using: composite
  steps:
    - name: Install shellcheck (pinned)
      shell: bash
      run: |
        set -euo pipefail
        # renovate: datasource=github-releases depName=koalaman/shellcheck
        version=v0.11.0
        # Release downloads intermittently return 504; retry before failing.
        curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 "https://github.com/koalaman/shellcheck/releases/download/${version}/shellcheck-${version}.linux.x86_64.tar.xz" | tar -xJ
        sudo mv "shellcheck-${version}/shellcheck" /usr/local/bin/shellcheck
        rm -rf "shellcheck-${version}"
        shellcheck --version

    - name: Install pyright (pinned)
      shell: bash
      run: |
        set -euo pipefail
        # renovate: datasource=npm depName=pyright
        npm install -g pyright@1.1.414
        pyright --version
