name: 'Smart publish (capture credit signature)'
description: |
  Publish a tessl plugin, capturing the publish command's output so the confirm
  gate can NAME an out-of-credits failure from the logs.

  Replaces `tesslio/patch-version-publish` in the fleet publish pipeline. That
  third-party action is a `uses:` composite whose `tessl plugin publish` stdout
  cannot be captured for a later step, so a post-publish out-of-credits exit is
  indistinguishable from any other failure. This action runs the owned
  `skills/release/smart-publish.sh` instead: same auto-bump-from-registry +
  manifest commit-back behavior, plus the out-of-credits SIGNATURE the confirm
  gate needs to tolerate ONLY a credit exit and red every other failure
  (rules/ci-safety.md "Credits Never Block Publishing").

  Wire the publish step WITH `continue-on-error: true` so a post-publish exit
  does not fail the job before the confirm gate runs; the gate reads this step's
  `outcome` and its `credit-signature` output. The step still exits with the
  publish command's real code, so `outcome` reflects reality.

  Requirements (consumer must arrange):
    - `tessl` CLI set up and authenticated earlier in the job
      (`tesslio/setup-tessl@v2`).
    - `jq` on PATH (preinstalled on GitHub-hosted runners) to parse the script's
      JSON result.
    - `python3` on PATH (preinstalled) — the script emits its JSON with it.
    - The consumer repo checked out (`actions/checkout`) so the manifest and the
      coding-policy scripts (three levels up from this action) resolve.
    - `permissions: contents: write` so auto-bump can push the manifest bump to
      the protected branch. A rejected push reds the run (a bump-push failure) —
      there is no PR fallback, so no `pull-requests` permission is needed.

inputs:
  mode:
    description: "'auto-bump' (publish --bump patch from the registry, commit the resolved version back) or 'as-is' (publish the manifest version verbatim, no bump, no commit-back)."
    required: true
  path:
    description: 'Plugin directory to publish; the manifest is auto-detected under it.'
    required: false
    default: '.'

outputs:
  credit-signature:
    description: |
      'true' when the publish exited non-zero AND its output carried the
      out-of-credits signature; 'false' otherwise. The confirm phase tolerates a
      non-zero exit only when this is 'true' AND the registry advanced.
    value: ${{ steps.publish.outputs.credit-signature }}
  version:
    description: |
      The published version — including on the landed-after-error path, where
      the publish command exited non-zero but the registry confirmed that exact
      version landed. Empty only when nothing landed.
    value: ${{ steps.publish.outputs.version }}
  landed-after-error:
    description: |
      'true' when the publish command exited non-zero AND the registry proved
      the exact version landed anyway (an out-of-credits billing exit, or the
      tessl CLI's ~20s client-side publish timeout). The step then exits 0 —
      the release is real — and this action emits a ::warning:: naming the
      failing line. 'false' otherwise.
    value: ${{ steps.publish.outputs.landed-after-error }}

runs:
  using: 'composite'
  steps:
    - name: Smart publish
      id: publish
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        PLUGIN_PATH: ${{ inputs.path }}
      run: |
        set -uo pipefail

        # Deterministic publish + capture logic lives in the sibling script
        # (rules/script-delegation.md); this glue only resolves it and
        # translates its JSON into step outputs. Scripts live in the plugin
        # tree, three levels up from the action path (same as stamp-changelog /
        # publish-landed-gate).
        script="$GITHUB_ACTION_PATH/../../../skills/release/smart-publish.sh"
        if [ ! -f "$script" ]; then
          echo "::error::smart-publish: smart-publish.sh not found at $script — verify the pinned jbaruch/coding-policy/.github/actions/smart-publish@<ref> in this workflow points at a ref that carries skills/release/smart-publish.sh, and bump the ref if it is stale." >&2
          exit 1
        fi

        # The script emits ONE JSON line on stdout and streams the publish log +
        # diagnostics to stderr (visible in the run log). Capture the JSON and
        # the publish's real exit code; even on failure the JSON is emitted, so
        # the credit-signature output is always set.
        rc=0
        result_json="$(bash "$script" "$MODE" "$PLUGIN_PATH" "$GITHUB_REF_NAME" "$GITHUB_REF_TYPE")" || rc=$?

        credit_signature=false
        version=""
        landed_after_error=false
        terminal_line=""
        publish_exit_code=""
        if [ -n "$result_json" ] && printf '%s' "$result_json" | jq empty >/dev/null 2>&1; then
          credit_signature="$(printf '%s' "$result_json" | jq -r '.credit_signature // false')"
          version="$(printf '%s' "$result_json" | jq -r '.version // empty')"
          landed_after_error="$(printf '%s' "$result_json" | jq -r '.landed_after_error // false')"
          terminal_line="$(printf '%s' "$result_json" | jq -r '.terminal_line // empty')"
          publish_exit_code="$(printf '%s' "$result_json" | jq -r '.publish_exit_code // empty')"
        else
          echo "::warning::smart-publish: no parseable JSON result (exit ${rc}); treating credit-signature as false so the confirm gate reds an unconfirmed publish." >&2
        fi

        echo "credit-signature=$credit_signature" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "landed-after-error=$landed_after_error" >> "$GITHUB_OUTPUT"

        # A landed-after-error publish is a REAL release with a failing step in
        # it. rules/ci-safety.md tolerates that only when the artifact landing
        # is confirmed AND the failing step is named — the script confirmed the
        # landing against the exact version, so name the step here, loudly,
        # rather than letting a green run hide it.
        if [ "$landed_after_error" = "true" ]; then
          # `publish_exit_code`, NOT `rc`: on this path the script reconciled the
          # failure and exited 0, so `rc` is 0 and a warning built from it would
          # claim the publish command "exited 0" while reporting that it failed.
          #
          # Escape the interpolated values as GitHub workflow-command DATA before
          # they reach the `::warning::`. `terminal_line` is upstream CLI output —
          # untrusted text — and a bare `%0A`/`%0D` in it would end the annotation
          # and let the rest of the line be parsed as its own workflow command.
          # `%` first, or it would double-escape the sequences added after it.
          esc() {
            local v="$1"
            v="${v//%/%25}"
            v="${v//$'\r'/%0D}"
            v="${v//$'\n'/%0A}"
            printf '%s' "$v"
          }
          echo "::warning::smart-publish: $(esc "$version") PUBLISHED, but the publish command exited ${publish_exit_code:-non-zero} afterwards: $(esc "${terminal_line:-<no terminal line captured>}"). The registry confirms the exact version landed, so the release is real; the failing step above still needs attention."
        fi

        # Exit with the publish's real code so this step's `outcome` reflects it
        # (the workflow sets continue-on-error so the job survives to the gate).
        exit "$rc"
