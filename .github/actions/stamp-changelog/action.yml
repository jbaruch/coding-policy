name: 'Stamp CHANGELOG with the published version'
description: |
  Stamps the CHANGELOG's newest (un-headed) entries with the version the
  publish step is about to assign, then commits the result with `[skip ci]`
  and pushes that commit itself.

  It always self-pushes the stamp commit rather than delegating to a downstream
  bump commit. Delegating stranded the stamp whenever the publish step exited
  non-zero AFTER publishing — e.g. a post-publish credit check aborts
  `patch-version-publish` before its bump commit/push runs, so the artifact
  ships while `CHANGELOG.md` on the branch keeps its un-headed `### ` entries
  (`jbaruch/coding-policy#284`). Self-pushing decouples the stamp from the
  publish step's exit status. The `[skip ci]` on the commit stops the push
  re-triggering the publish workflow (ci-safety Publish-Pipeline
  Loop-Prevention Carve-Out).

  Per `jbaruch/coding-policy: context-artifacts` "CHANGELOG Hygiene"
  (every merge publishes): PR authors add un-headed `### ` entry blocks at
  the top of `CHANGELOG.md`; this step inserts the `## <version> — <date>`
  heading above them before publish, so the published artifact and the
  registry "what's new" show them under their real version rather than as
  unversioned entries. Wire it immediately before the publish step.

  Idempotent: if the top section already carries a `## ` heading there is
  nothing un-headed to stamp and the step is a no-op (no commit).

  Requirements (consumer must arrange):
    - `python3` on PATH (stdlib only — the script needs no packages).
    - `tessl` CLI on PATH (typically via `tesslio/setup-tessl@v2`) so the
      script can read the registry's latest version. Skip this by passing
      `latest:` explicitly.
    - The consumer repo checked out (`actions/checkout@v4`) with a writable
      working tree; the step runs against `$GITHUB_WORKSPACE`.

inputs:
  changelog:
    description: 'Path to the CHANGELOG, relative to the workspace root'
    required: false
    default: 'CHANGELOG.md'
  manifest:
    description: |
      Path to the plugin manifest the version is read from. When empty the
      script auto-detects `.tessl-plugin/plugin.json`, then `tile.json`.
    required: false
    default: ''
  latest:
    description: |
      Latest published version (X.Y.Z) to compute against. When empty the
      script queries the registry via `tessl plugin info`. Set it to skip
      the registry query (testing / offline runs).
    required: false
    default: ''
  date:
    description: 'Heading date (YYYY-MM-DD). When empty, today in UTC.'
    required: false
    default: ''
  commit:
    description: |
      When 'true' (default), commit the stamped CHANGELOG with `[skip ci]`
      and push that commit. Set 'false' to leave it staged for the caller to
      commit.
    required: false
    default: 'true'
  commit-message:
    description: |
      Commit message for the stamp commit. `[skip ci]` is appended if absent
      — loop-prevention requires it, so it cannot be overridden away.
    required: false
    default: 'Stamp CHANGELOG for the published version [skip ci]'

runs:
  using: 'composite'
  steps:
    - name: Stamp CHANGELOG and commit
      shell: bash
      env:
        CHANGELOG: ${{ inputs.changelog }}
        MANIFEST: ${{ inputs.manifest }}
        LATEST: ${{ inputs.latest }}
        DATE: ${{ inputs.date }}
        DO_COMMIT: ${{ inputs.commit }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        set -eo pipefail

        # The script is the single source of truth; it lives in the plugin
        # tree, not this action dir. `uses: <owner>/coding-policy/.github/
        # actions/stamp-changelog@<ref>` checks out the whole repo, so it
        # resolves three levels up from the action path.
        script="$GITHUB_ACTION_PATH/../../../skills/release/stamp-changelog.py"
        if [ ! -f "$script" ]; then
          echo "::error::stamp-changelog.py not found at $script — verify the pinned jbaruch/coding-policy/.github/actions/stamp-changelog@<ref> in this workflow points at a ref that carries skills/release/stamp-changelog.py, and bump the ref if it is stale." >&2
          exit 1
        fi

        # Append optional flags with explicit `if` blocks — clearer than
        # `&&` one-liners and unambiguous to read.
        args=(--changelog "$CHANGELOG")
        if [ -n "$MANIFEST" ]; then args+=(--manifest "$MANIFEST"); fi
        if [ -n "$LATEST" ]; then args+=(--latest "$LATEST"); fi
        if [ -n "$DATE" ]; then args+=(--date "$DATE"); fi

        python3 "$script" "${args[@]}"

        # The deterministic git side effects (stage / commit with a guaranteed
        # `[skip ci]` / self-push) live in a script so they are testable against
        # a temporary remote — see skills/release/tests/test_commit_stamp.sh.
        # Same three-levels-up resolution as the python script above.
        commit_script="$GITHUB_ACTION_PATH/../../../skills/release/commit-stamp.sh"
        if [ ! -f "$commit_script" ]; then
          echo "::error::commit-stamp.sh not found at $commit_script — verify the pinned jbaruch/coding-policy/.github/actions/stamp-changelog@<ref> in this workflow points at a ref that carries skills/release/commit-stamp.sh, and bump the ref if it is stale." >&2
          exit 1
        fi
        bash "$commit_script" "$CHANGELOG" "$DO_COMMIT" "$COMMIT_MESSAGE" "$GITHUB_REF_NAME" "$GITHUB_REF_TYPE"
