name: 'Skill review (changed only)'
description: |
  Runs `tessl review run --threshold N` on every skill whose files
  changed since the previous push, instead of every skill in the plugin.
  Per `jbaruch/coding-policy: context-artifacts` "Mandatory Review":
  every skill change must pass review, but unchanged skills do not
  need to be re-reviewed on every publish — that just burns runner
  time and Tessl credits.

  Detection: `git diff $BASE..HEAD -- $skills-dir/`. BASE is the input
  `base-ref` if provided, else `github.event.before` for push events.
  On `workflow_dispatch` or initial push (no usable base), reviews
  every skill (manual triggers expect a full re-review).

  Requirements (consumer must arrange):
    - `tessl` CLI on PATH (typically via `tesslio/setup-tessl@v2`).
    - Repository checked out with full history reachable from BASE
      (typically `actions/checkout@v4` with `fetch-depth: 0`).

inputs:
  threshold:
    description: 'Minimum score required for a skill to pass review'
    required: false
    default: '85'
  skills-dir:
    description: 'Directory containing skill subdirectories (relative to workspace root)'
    required: false
    default: 'skills'
  base-ref:
    description: |
      Override the base ref/SHA for the diff. When empty, the action falls
      back to `github.event.before` (push events) or "review all"
      (workflow_dispatch / initial push).
    required: false
    default: ''
  workspace:
    description: |
      Tessl workspace passed to `tessl review run --workspace` (the flag is
      mandatory in the CLI). When empty, it is derived from the consumer's
      plugin manifest name (`<workspace>/<plugin>` in
      `.tessl-plugin/plugin.json`, falling back to `tile.json`) — the
      workspace is already declared there, so most consumers set nothing.
      Set it only when the review workspace differs from the publish one.
    required: false
    default: ''
  credit-outage:
    description: |
      How a tessl "out of credits" (403) billing outage during review is
      handled. `fail` (default) preserves the Mandatory Review gate — any
      review failure, credit outage included, blocks the publish. `skip`
      is fail-safe and narrow: ONLY a review call failing with the
      out-of-credits signature is tolerated (that skill publishes
      unreviewed, named in the run summary and the `unreviewed-skills`
      output); every other non-zero exit — a below-threshold score, an
      auth error, a tooling bug — still hard-fails. Opting in requires the
      `context-artifacts` Mandatory Review Credit-Outage carve-out.
    required: false
    default: 'fail'

outputs:
  unreviewed-skills:
    description: |
      Comma-separated skills that were NOT reviewed because the tessl org
      was out of credits (empty when every changed skill was reviewed).
      Only ever non-empty under `credit-outage: skip`. Gate follow-up
      steps on it to flag or track an unreviewed publish.
    value: ${{ steps.review.outputs.unreviewed-skills }}

runs:
  using: 'composite'
  steps:
    # Body lives in review-skills.sh (a real, unit-tested file per
    # rules/script-delegation.md), invoked via bash so no exec-bit is
    # required — tessl packaging normalizes plugin file modes.
    - name: Identify changed skills and review them
      id: review
      shell: bash
      env:
        EVENT_BEFORE: ${{ github.event.before }}
        EVENT_NAME: ${{ github.event_name }}
        BASE_OVERRIDE: ${{ inputs.base-ref }}
        THRESHOLD: ${{ inputs.threshold }}
        SKILLS_DIR: ${{ inputs.skills-dir }}
        CREDIT_OUTAGE: ${{ inputs.credit-outage }}
        WORKSPACE: ${{ inputs.workspace }}
      run: bash "$GITHUB_ACTION_PATH/review-skills.sh"
