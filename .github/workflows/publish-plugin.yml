name: Publish plugin (reusable)

# Canonical fleet publish pipeline, called by each consumer's thin
# `publish.yml`. Unifies the drifted per-repo publish workflows
# (publish-tile.yml / publish-plugin.yml / publish.yml) onto one definition
# (jbaruch/coding-policy#206) — consumers carry only triggers + a caller
# block, this owns the steps and the third-party action versions.
#
# Consumer caller (thin):
#   jobs:
#     publish:
#       uses: jbaruch/coding-policy/.github/workflows/publish-plugin.yml@<sha>
#       secrets: inherit
#       with:
#         stamp-changelog: true          # optional
#         python-version: '3.11'         # optional — only if the gate needs it
#         pre-publish-script: .github/pre-publish.sh   # optional repo-specific gate
#         publish-mode: as-is            # optional — default auto-bump
#
# Sibling composite actions are referenced by full path at `@main`, not a
# local `./` path: in a called reusable workflow a `./` path resolves
# against the CALLER's checkout (which has no coding-policy actions). The
# `@main` self-reference is sanctioned by the dependency-management Same-Repo
# Reusable-Workflow Action Carve-Out (no scanner renews same-repo refs; a SHA
# pin of one's own repo is circular). It also keeps the review rubric +
# CHANGELOG stamp tracking current policy, the same always-latest contract as
# the consumer's runtime `tessl install jbaruch/coding-policy`. Consumers pin
# THIS workflow (`@<sha>`) for reproducible caller logic.

on:
  workflow_call:
    inputs:
      python-version:
        description: 'If set, sets up this Python before the pre-publish gate (for gates needing a pinned interpreter). Empty = no Python setup.'
        type: string
        default: ''
      pre-publish-script:
        description: 'Path (in the caller repo) to a bash gate script run after checkout, before publish. Empty = no repo-specific gate.'
        type: string
        default: ''
      skills-dir:
        description: 'Directory holding skill subdirectories, passed to the skill-review action.'
        type: string
        default: 'skills'
      skill-review-credit-outage:
        description: "Skill-review tessl out-of-credits (403) handling. 'fail' (default) preserves the Mandatory Review gate; 'skip' is the explicit per-consumer opt-in under the context-artifacts Credit-Outage Review Carve-Out."
        type: string
        default: 'fail'
      stamp-changelog:
        description: 'Stamp the CHANGELOG version heading before publish.'
        type: boolean
        default: false
      publish-mode:
        description: "'auto-bump' = tesslio/patch-version-publish (bump + commit + publish); 'as-is' = tessl plugin publish (manifest version verbatim, no bump)."
        type: string
        default: 'auto-bump'
    secrets:
      TESSL_TOKEN:
        required: true

permissions:
  id-token: write
  contents: write # smart-publish pushes the auto-bump commit to the protected branch

concurrency:
  # One in-flight publish per consumer repo; never cancel a running publish.
  group: publish-plugin-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the changed-skills review can diff
          # github.event.before..HEAD.
          fetch-depth: 0

      - name: Set up Python
        if: inputs.python-version != ''
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      # Repo-specific gate (pyright, unit tests, custom lints, carve-out
      # checks). Deterministic gate logic lives in the caller's script per
      # rules/script-delegation.md; this just invokes it. Runs before the
      # tessl steps — the gates are self-contained (no tessl needed).
      - name: Repo-specific pre-publish gate
        if: inputs.pre-publish-script != ''
        run: bash "${{ inputs.pre-publish-script }}"

      - uses: tesslio/setup-tessl@v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}

      # Capture the registry's latest version BEFORE publish, so the post-
      # publish gate can tell "the artifact landed then a downstream step
      # failed" (out-of-credits after `✔ Published`) from "publish genuinely
      # failed". Empty output = the tile has never published (first-publish
      # baseline). Sibling action referenced by full path @main (same-repo
      # reusable-workflow carve-out) — a `./` path would resolve against the
      # caller's checkout.
      - name: Capture registry baseline
        id: baseline
        uses: jbaruch/coding-policy/.github/actions/publish-landed-gate@main
        with:
          phase: capture

      # Fail loudly on an unrecognized publish-mode: otherwise both publish
      # steps below would be skipped and the run would pass green having
      # published nothing (rules/error-handling.md — no silent success).
      - name: Validate publish-mode
        env:
          MODE: ${{ inputs.publish-mode }}
        run: |
          set -euo pipefail
          case "$MODE" in
            auto-bump|as-is) ;;
            *) echo "::error::publish-mode must be 'auto-bump' or 'as-is', got '$MODE'" >&2; exit 1 ;;
          esac

      - name: Lint plugin
        run: tessl plugin lint

      # Reviews only the skills whose files changed in this push, against the
      # latest published jbaruch/coding-policy. Threshold is fixed at 85 —
      # context-artifacts forbids lowering it, so it is not a caller input.
      # credit-outage defaults to `fail`; a consumer opts into `skip` per the
      # Credit-Outage Review Carve-Out's explicit-opt-in precondition.
      - name: Skill review (changed only)
        uses: jbaruch/coding-policy/.github/actions/skill-review@main
        with:
          threshold: '85'
          skills-dir: ${{ inputs.skills-dir }}
          credit-outage: ${{ inputs.skill-review-credit-outage }}

      # Stamps the top un-headed `### ` CHANGELOG blocks with the
      # `## <version> — <date>` heading the publish step is about to assign,
      # per context-artifacts "CHANGELOG Hygiene". Must run immediately before
      # publish. No-op when the top section is already headed.
      - name: Stamp CHANGELOG with the version being published
        if: inputs.stamp-changelog
        uses: jbaruch/coding-policy/.github/actions/stamp-changelog@main

      # Owned publish (skills/release/smart-publish.sh via the smart-publish
      # action) rather than tesslio/patch-version-publish: it captures the
      # publish command's output so the confirm gate can NAME an out-of-credits
      # failure from the logs, not merely infer it from the org's live credit
      # balance (rules/ci-safety.md "Credits Never Block Publishing"). Handles
      # both modes: auto-bump (--bump patch from the registry + a `Bump … [skip
      # ci]` manifest commit-back per the publish-pipeline loop-prevention
      # carve-out, mirroring patch-version-publish) and as-is (manifest version
      # verbatim, no bump, no commit-back — a missing human bump surfaces as a
      # red `version already exists`). Sibling action referenced by full path
      # @main (same-repo reusable-workflow carve-out).
      #
      # continue-on-error: a post-publish out-of-credits exit lands the artifact
      # then exits non-zero. Do NOT let that red the job here — the confirm gate
      # below reconciles this step's real `outcome` + `credit-signature` against
      # the registry.
      - name: Publish
        id: publish
        continue-on-error: true
        uses: jbaruch/coding-policy/.github/actions/smart-publish@main
        with:
          mode: ${{ inputs.publish-mode }}

      # Fail-SAFE gate. Reads the publish step's real `outcome` (before
      # continue-on-error masks it), the pre-publish baseline, and the
      # credit-signature; passes only when the registry advanced (artifact
      # landed) AND either the step succeeded or its output carried the
      # out-of-credits signature, and reds a genuine non-landing OR non-credit
      # failure. No continue-on-error — this step's exit code gates the job.
      - name: Confirm publish landed
        uses: jbaruch/coding-policy/.github/actions/publish-landed-gate@main
        with:
          phase: confirm
          baseline: ${{ steps.baseline.outputs.baseline }}
          publish-outcome: ${{ steps.publish.outcome }}
          credit-signature: ${{ steps.publish.outputs.credit-signature }}
