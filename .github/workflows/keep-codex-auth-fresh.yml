name: Keep Codex auth fresh

# The review workflow authenticates with a ChatGPT-subscription token
# (~/.codex/auth.json) persisted in the actions cache. Codex refreshes that
# token during use, but on a quiet week with no PRs the cached token could age
# past its refresh window and force a manual re-login. This weekly job runs a
# no-op `codex exec` so Codex refreshes the token, then saves it back to the
# cache. See .github/workflows/review-codex.yml for the one-time operator setup.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Codex CLI
        run: npm install -g @openai/codex@0.142.5

      - name: Restore Codex auth
        uses: actions/cache/restore@v4
        with:
          path: ~/.codex/auth.json
          key: codex-auth-${{ github.run_id }}
          restore-keys: codex-auth-

      - name: Seed auth.json from the secret only if the cache had none
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          set -euo pipefail
          export CODEX_HOME="$HOME/.codex"
          mkdir -p "$CODEX_HOME"; chmod 700 "$CODEX_HOME"
          if [ ! -f "$CODEX_HOME/auth.json" ]; then
            if [ -z "${CODEX_AUTH_JSON:-}" ]; then
              echo "error: no cached auth and CODEX_AUTH_JSON secret is empty — run 'codex login' and store ~/.codex/auth.json as CODEX_AUTH_JSON" >&2
              exit 1
            fi
            printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"
            chmod 600 "$CODEX_HOME/auth.json"
          fi

      - name: Refresh the token
        run: |
          set -euo pipefail
          codex exec --json --skip-git-repo-check --dangerously-bypass-approvals-and-sandbox "Reply with OK."

      - name: Persist the refreshed auth token
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.codex/auth.json
          key: codex-auth-${{ github.run_id }}
