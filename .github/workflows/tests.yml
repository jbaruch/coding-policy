name: Tests

# Three gates on every PR (and on direct pushes to main):
#   1. diagnostics — shellcheck over every first-party shell script and
#      pyright over the first-party Python, at zero findings
#      (rules/language-diagnostics.md). Runs first: static checks are fast
#      and cheap, so style/type regressions block before the suites run
#      (rules/code-formatting.md CI Integration).
#   2. lint — `tessl plugin lint` (manifest + skill-frontmatter + structure
#      validation). Pre-merge so a bad manifest or frontmatter (e.g. an
#      over-length skill `description`) is caught here, not only when it
#      breaks publish.yml's first step after merge.
#   3. unit-tests — every module's bash unit suite via scripts/run-tests.sh
#      (rules/testing-standards.md). Gated on diagnostics passing.
# publish.yml reruns lint + diagnostics + the suites before release as
# defense-in-depth.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-diagnostics
      - name: Run language-diagnostics gate
        run: bash scripts/run-diagnostics.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: tesslio/setup-tessl@v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}
      - name: Lint plugin
        run: tessl plugin lint

  acr-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: jbaruch/agentic-context-registry
          # Review monthly and after ACR release-contract changes; re-pin in a dedicated dependency PR.
          ref: f8dffcecc0eb98f13b2d7d90cd399f99208becf2
          path: .test-dependencies/acr
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0; Renovate
        with:
          go-version-file: .test-dependencies/acr/go.mod
          cache-dependency-path: .test-dependencies/acr/go.sum
      - name: Validate ACR manifest and selected files
        working-directory: .test-dependencies/acr
        run: go run ./cmd/acr validate ../.. --json

  unit-tests:
    needs: [diagnostics, lint, acr-manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tessl CLI for actual package exclusion regressions
        uses: tesslio/setup-tessl@v2
        with:
          # Renew monthly, atomically with TESSL_VERSION in the package verifier
          # and fleet-publish-finalize.yml, in a dedicated dependency change.
          version: '0.119.0'
      - name: Run unit test suites
        run: bash scripts/run-tests.sh
