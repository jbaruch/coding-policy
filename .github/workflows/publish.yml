name: Review & Publish Plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: publish-plugin
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Need history reachable from `github.event.before` so the
          # changed-skills detection below can run `git diff $BEFORE..HEAD`.
          fetch-depth: 0

      - uses: tesslio/setup-tessl@v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}

      # Capture the registry's latest version BEFORE publish so the post-
      # publish gate can distinguish "artifact landed then a downstream step
      # failed" (out-of-credits after `✔ Published`) from a genuine publish
      # failure. Dogfoods the action consumers call as
      # `uses: jbaruch/coding-policy/.github/actions/publish-landed-gate@<ref>`.
      - name: Capture registry baseline
        id: baseline
        uses: ./.github/actions/publish-landed-gate
        with:
          phase: capture

      - name: Lint plugin
        run: tessl plugin lint

      # Defense-in-depth: tests.yml already gates PRs on diagnostics + the
      # suites, but publish.yml runs independently on push to main — so
      # block the publish on either failing here too. Static checks first.
      - uses: ./.github/actions/setup-diagnostics
      - name: Run language diagnostics
        run: bash scripts/run-diagnostics.sh

      - name: Run unit tests
        run: bash scripts/run-tests.sh

      # Reviews only the skills whose files changed since the previous
      # push. Action is dogfooded from this repo via the local path
      # `./.github/actions/skill-review`; consumer repos call it as
      # `uses: jbaruch/coding-policy/.github/actions/skill-review@<ref>`.
      - name: Skill review (changed only)
        uses: ./.github/actions/skill-review
        with:
          threshold: '85'
          # Opt into the fail-safe out-of-credits tolerance (issue #188):
          # a tessl billing 403 skips the affected skill (flagged in the run
          # summary and unreviewed-skills output) instead of blocking every
          # skill-changing merge until credits reset. Every other review
          # failure still hard-fails. Sanctioned by the context-artifacts
          # Credit-Outage Review Carve-Out.
          credit-outage: 'skip'

      # Dogfoods the reusable action consumers call as
      # `uses: jbaruch/coding-policy/.github/actions/stamp-changelog@<ref>`.
      # The action self-pushes its stamp commit ([skip ci] guards the
      # re-trigger), decoupled from patch-version-publish's exit status (#284).
      - name: Stamp CHANGELOG with the version being published
        uses: ./.github/actions/stamp-changelog

      # Owned publish (skills/release/smart-publish.sh via the smart-publish
      # action) rather than tesslio/patch-version-publish: it captures the
      # publish command's output so the confirm gate can NAME an out-of-credits
      # failure from the logs, not merely infer it from the org's live credit
      # balance (rules/ci-safety.md "Credits Never Block Publishing" — a red run
      # is attributed to credits only by confirming the artifact landed AND
      # naming the failing step). Same auto-bump + manifest commit-back as
      # patch-version-publish.
      #
      # continue-on-error: a post-publish out-of-credits exit lands the artifact
      # then exits non-zero. Do NOT let that red the job here — the confirm gate
      # below reconciles this step's real `outcome` + `credit-signature` against
      # the registry.
      - name: Publish (auto-bump)
        id: publish_autobump
        continue-on-error: true
        uses: ./.github/actions/smart-publish
        with:
          mode: auto-bump

      # Fail-SAFE gate. No continue-on-error — its exit code gates the job:
      # green only when the registry advanced (artifact landed) AND either the
      # publish succeeded or its output carried the out-of-credits signature;
      # red on a genuine non-landing OR non-credit failure. This repo is
      # auto-bump only, so the outcome is the single publish step's.
      - name: Confirm publish landed
        uses: ./.github/actions/publish-landed-gate
        with:
          phase: confirm
          baseline: ${{ steps.baseline.outputs.baseline }}
          publish-outcome: ${{ steps.publish_autobump.outcome }}
          credit-signature: ${{ steps.publish_autobump.outputs.credit-signature }}
