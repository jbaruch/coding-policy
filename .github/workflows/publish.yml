name: Review & Publish Plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: publish-plugin
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history reachable from `github.event.before` so the
          # changed-skills detection below can run `git diff $BEFORE..HEAD`.
          fetch-depth: 0

      - uses: tesslio/setup-tessl@v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}

      - name: Lint plugin
        run: tessl plugin lint

      # Defense-in-depth: tests.yml already gates PRs on these suites, but
      # a direct push to main (content-only carve-out, admin) skips that
      # gate — so block the publish on a red suite too.
      - name: Run unit tests
        run: bash scripts/run-tests.sh

      # Reviews only the skills whose files changed since the previous
      # push. Action is dogfooded from this repo via the local path
      # `./.github/actions/skill-review`; consumer repos call it as
      # `uses: jbaruch/coding-policy/.github/actions/skill-review@<ref>`.
      - name: Skill review (changed only)
        uses: ./.github/actions/skill-review
        with:
          threshold: '85'

      # Dogfoods the reusable action consumers call as
      # `uses: jbaruch/coding-policy/.github/actions/stamp-changelog@<ref>`.
      # Commit only, no push — patch-version-publish's own commit/push
      # carries it along; [skip ci] guards the re-trigger.
      - name: Stamp CHANGELOG with the version being published
        uses: ./.github/actions/stamp-changelog

      - uses: tesslio/patch-version-publish@v1
        with:
          token: ${{ secrets.TESSL_TOKEN }}
