name: Fleet Reviews (Codex policy, Claude quality)

# Central fleet reviewer: reviews every open same-repo PR across the reviewer
# App's installation in independent policy and code-quality lanes. Both
# subscription credentials are held only in this repo. Replaces the per-repo
# review-codex.yml fleet (blast radius for CODEX_AUTH_JSON drops from 22 to 1).
#
# Secrets required in THIS repo only:
#   CODEX_AUTH_JSON       — the ChatGPT-subscription token (see review-codex.yml header)
#   CLAUDE_CODE_OAUTH_TOKEN — Claude subscription token from claude setup-token
#   FLEET_APP_ID          — the coding-policy-fleet-reviewer GitHub App's App ID
#   CLAUDE_REVIEW_APP_ID / CLAUDE_REVIEW_APP_PRIVATE_KEY — separate quality App
#   FLEET_APP_PRIVATE_KEY — that App's private key (PEM)
#   TESSL_TOKEN           — to `tessl install jbaruch/coding-policy` in CI
#
# Both Apps (Pull requests: RW, Contents: RO, Metadata: RO) must be installed on
# every reviewed repo. It posts reviews as `<app-slug>[bot]`; a pass posts as
# APPROVE and a violation as REQUEST_CHANGES (post-review.sh). The App identity
# can APPROVE (unlike github-actions[bot], which gets HTTP 422 and falls back to
# COMMENT), so a clean review of a new head supersedes an earlier
# REQUEST_CHANGES — no stale-review dismissal needed in the reviewed repo.
#
# One verdict per head (issue #841): every review runs in the `review` job,
# started only by a single-PR workflow_dispatch, whether a consumer's push or
# the cron `poll` job sent it. Its per-PR, per-lane concurrency group runs one
# review of a PR's lane at a time. A queued run on an already-reviewed head
# posts nothing (post-review.sh, review.py).
#
# Token isolation: fleet-review-one.sh scrubs the App token from the workdir and
# the environment before the sandbox-bypassed Codex step runs; the Codex auth.json
# is guarded by assert-no-secret-leak.sh. See that script's header.

on:
  schedule:
    # Every 15 min: the poll only lists PRs whose current head a lane has not
    # reviewed and dispatches a single-PR review for each, so it finishes in
    # seconds and polls do not pile up under its concurrency guard below.
    - cron: "*/15 * * * *"
  # PR-time path: a consumer's thin review-trigger.yml calls this with the PR
  # coords for an immediate single-PR review; the cron poll dispatches the same
  # way for any PR the trigger missed. Without `repo`, a manual run polls.
  workflow_dispatch:
    inputs:
      repo:
        description: "Consumer repo name (under jbaruch/) to review a single PR of"
        required: false
      pr:
        description: "PR number to review"
        required: false
      base:
        description: "Base branch of the PR"
        required: false

      reviewer:
        description: "Review lane (all by default; select one for recovery or a canary)"
        type: choice
        options: [all, policy, quality]
        default: all

permissions:
  contents: read

jobs:
  poll:
    # Dormant until activated: set repo variable FLEET_REVIEWER_ENABLED=true once
    # the GitHub App is installed and FLEET_APP_ID / FLEET_APP_PRIVATE_KEY /
    # CODEX_AUTH_JSON / CLAUDE_CODE_OAUTH_TOKEN / TESSL_TOKEN secrets are set. Until then scheduled runs
    # are skipped (neutral, no failure noise) and workflow_dispatch is a no-op.
    if: vars.FLEET_REVIEWER_ENABLED == 'true' && !github.event.inputs.repo
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event.inputs.reviewer == 'quality' && '["quality"]' || github.event.inputs.reviewer == 'policy' && '["policy"]' || '["policy","quality"]') }}
    # One poll per lane at a time; a new poll queues behind a running one.
    concurrency:
      group: fleet-review-poll-${{ matrix.lane }}
      cancel-in-progress: false
    permissions:
      contents: read
      # gh workflow run: a workflow_dispatch sent with GITHUB_TOKEN creates a run.
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Discovery only reads, so this token cannot post a review.
      - name: Mint a read-only reviewer App installation token
        id: apptoken
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets[matrix.lane == 'quality' && 'CLAUDE_REVIEW_APP_ID' || 'FLEET_APP_ID'] }}
          private-key: ${{ secrets[matrix.lane == 'quality' && 'CLAUDE_REVIEW_APP_PRIVATE_KEY' || 'FLEET_APP_PRIVATE_KEY'] }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-pull-requests: read

      - name: Dispatch a review of each PR that needs one
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
          DISPATCH_TOKEN: ${{ github.token }}
          REVIEWER_LOGIN: ${{ steps.apptoken.outputs.app-slug }}[bot]
          REVIEW_LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          worklist=$(bash .github/codex-review/fleet-poll.sh)
          if ! items=$(jq -r '.[] | [.repo, .number, .base_ref] | @tsv' <<<"$worklist"); then
            echo "error: fleet-poll.sh printed no JSON array of {repo,number,base_ref} items; inspect its output above" >&2
            exit 1
          fi
          fail=0
          while IFS=$'\t' read -r repo pr base; do
            [ -n "$repo" ] || continue
            if GH_TOKEN="$DISPATCH_TOKEN" gh workflow run fleet-review.yml --repo "$GITHUB_REPOSITORY" \
                -f repo="$repo" -f pr="$pr" -f base="$base" -f reviewer="$REVIEW_LANE"; then
              echo "dispatched a ${REVIEW_LANE} review of ${repo}#${pr}"
            else
              echo "::warning::could not dispatch a ${REVIEW_LANE} review of ${repo}#${pr}; the next poll retries it"
              fail=1
            fi
          done <<<"$items"
          exit "$fail"

  review:
    if: vars.FLEET_REVIEWER_ENABLED == 'true' && github.event.inputs.repo
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event.inputs.reviewer == 'quality' && '["quality"]' || github.event.inputs.reviewer == 'policy' && '["policy"]' || '["policy","quality"]') }}
    # Push and poll dispatches of one PR's lane share this group, so they run
    # one at a time. A queued run never cancels a running one; a newer queued
    # run replaces an older queued one.
    concurrency:
      group: fleet-review-${{ github.event.inputs.repo }}-${{ github.event.inputs.pr }}-${{ matrix.lane }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Backstop so a stuck run cannot hold the concurrency slot and block the queue.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-acr-metadata
        if: matrix.lane == 'policy'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - uses: tesslio/setup-tessl@v2
        if: matrix.lane == 'policy'
        with:
          token: ${{ secrets.TESSL_TOKEN }}

      # renovate: datasource=npm depName=@openai/codex
      - name: Install Codex CLI
        if: matrix.lane == 'policy'
        run: npm install -g @openai/codex@0.164.0

      # renovate: datasource=npm depName=@anthropic-ai/claude-code
      - name: Install Claude CLI
        if: matrix.lane == 'quality'
        run: npm install -g @anthropic-ai/claude-code@2.1.310

      - name: Verify real CLI context isolation
        if: matrix.lane == 'quality'
        run: python3 .github/claude-review/check-isolation.py

      - name: Mint the reviewer App installation token
        id: apptoken
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets[matrix.lane == 'quality' && 'CLAUDE_REVIEW_APP_ID' || 'FLEET_APP_ID'] }}
          private-key: ${{ secrets[matrix.lane == 'quality' && 'CLAUDE_REVIEW_APP_PRIVATE_KEY' || 'FLEET_APP_PRIVATE_KEY'] }}
          owner: ${{ github.repository_owner }}

      - name: Write auth.json from the secret (runtime-only, never persisted)
        if: matrix.lane == 'policy'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${CODEX_AUTH_JSON:-}" ]; then
            echo "error: CODEX_AUTH_JSON secret is empty — re-seed it (see review-codex.yml header)" >&2
            exit 1
          fi
          export CODEX_HOME="$HOME/.codex"
          mkdir -p "$CODEX_HOME"; chmod 700 "$CODEX_HOME"
          printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"
          chmod 600 "$CODEX_HOME/auth.json"

      - name: Redact the credential from CI logs
        if: matrix.lane == 'policy'
        run: bash .github/codex-review/mask-secrets.sh "$HOME/.codex/auth.json"

      - name: Review the dispatched PR
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
          CENTRAL_DIR: ${{ github.workspace }}
          REVIEWER_LOGIN: ${{ steps.apptoken.outputs.app-slug }}[bot]
          REVIEW_LANE: ${{ matrix.lane }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.lane == 'quality' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          DISPATCH_REPO: ${{ github.event.inputs.repo }}
          DISPATCH_PR: ${{ github.event.inputs.pr }}
          DISPATCH_BASE: ${{ github.event.inputs.base }}
        run: |
          set -euo pipefail
          # Validate inputs up front so a bad dispatch fails here, not deep in a git fetch.
          if ! [[ "${DISPATCH_REPO}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "error: dispatch input 'repo' must be a bare repo name under jbaruch/ (no owner/slash), got '${DISPATCH_REPO}'" >&2
            exit 1
          fi
          if ! [[ "${DISPATCH_PR:-}" =~ ^[0-9]+$ ]]; then
            echo "error: dispatch input 'pr' must be a number, got '${DISPATCH_PR:-}'" >&2
            exit 1
          fi
          if [ -z "${DISPATCH_BASE:-}" ]; then
            echo "error: dispatch input 'base' is required when 'repo' is set" >&2
            exit 1
          fi
          if [ "$REVIEW_LANE" = quality ]; then
            python3 .github/claude-review/review.py jbaruch "$DISPATCH_REPO" "$DISPATCH_PR" "$DISPATCH_BASE"
          else
            bash .github/codex-review/fleet-review-one.sh jbaruch "$DISPATCH_REPO" "$DISPATCH_PR" "$DISPATCH_BASE"
          fi

      - name: Drop the Codex credential
        if: always() && matrix.lane == 'policy'
        run: rm -f "$HOME/.codex/auth.json"
