name: PR Policy Review (Codex, subscription)

# Reviews every same-repo pull request against this repo's in-tree rules/*.md
# using the Codex CLI authenticated by a ChatGPT subscription (no API key).
# The subscription token is read ONLY from the CODEX_AUTH_JSON secret at
# runtime (rules/no-secrets.md) — it is never persisted to the actions cache
# or anywhere else on the runner. Codex refreshes the access token in-memory
# from the refresh token for the duration of the run; if the refresh token
# itself ever expires, the review fails loudly and the operator re-seeds the
# secret (step 2 below).
#
# One-time operator setup (cannot be automated — it needs a browser login):
#   1. On a trusted machine, set file-based credential storage and run
#      `codex login` (Sign in with ChatGPT). Confirm ~/.codex/auth.json has
#      "auth_mode": "chatgpt" and "has_refresh_token": true.
#   2. Store the FULL contents of ~/.codex/auth.json as the repo secret
#      CODEX_AUTH_JSON (re-run this whenever the review fails on expired auth):
#        gh secret set CODEX_AUTH_JSON < ~/.codex/auth.json
# See https://learn.chatgpt.com/docs/auth/ci-cd-auth

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Fork PRs cannot read secrets, so the review only runs for same-repo PRs.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip fork PRs (no secret access) — they are adopted via the adopt-fork-pr skill.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # renovate: datasource=npm depName=@openai/codex
      - name: Install Codex CLI
        run: npm install -g @openai/codex@0.142.5

      - name: Write auth.json from the secret (runtime-only, never persisted)
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${CODEX_AUTH_JSON:-}" ]; then
            echo "error: CODEX_AUTH_JSON secret is empty — run 'codex login' on a trusted machine and 'gh secret set CODEX_AUTH_JSON < ~/.codex/auth.json' (see this workflow's header)" >&2
            exit 1
          fi
          export CODEX_HOME="$HOME/.codex"
          mkdir -p "$CODEX_HOME"; chmod 700 "$CODEX_HOME"
          printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"
          chmod 600 "$CODEX_HOME/auth.json"

      # Register each token with ::add-mask:: BEFORE any PR-controlled agent
      # code runs, so a prompt-injected attempt to print the credential is
      # redacted as *** in the (public) CI logs (rules/no-secrets.md Logging).
      - name: Redact the credential from CI logs
        run: bash .github/codex-review/mask-secrets.sh "$HOME/.codex/auth.json"

      - name: Run Codex policy review
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.ref }}"
          codex exec \
            --json \
            --skip-git-repo-check \
            --dangerously-bypass-approvals-and-sandbox \
            --output-schema .github/codex-review/schema.json \
            --output-last-message /tmp/codex-final.json \
            - < .github/codex-review/prompt.md

      # Defense against prompt-injection exfil: a PR can edit the reviewed
      # rules/ or prompt to try to make Codex echo the subscription token into
      # its review. Refuse to post if any token string from auth.json appears
      # in the review output, then delete the credential before the (also
      # PR-controlled) post step runs so it is never in scope for later code.
      # (A collaborator editing this workflow itself is out of scope — same-repo
      # PRs require write access, which GitHub already treats as trusted.)
      - name: Guard against credential leakage, then drop the token
        run: |
          set -euo pipefail
          bash .github/codex-review/assert-no-secret-leak.sh "$HOME/.codex/auth.json" /tmp/codex-final.json
          rm -f "$HOME/.codex/auth.json"

      - name: Post the review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/codex-review/post-review.sh \
            "${{ github.repository_owner }}" \
            "${{ github.event.repository.name }}" \
            "${{ github.event.pull_request.number }}" \
            /tmp/codex-final.json
