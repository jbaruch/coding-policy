name: Finalize central fleet publication evidence

# A differently named workflow avoids self-triggered completion chains.
# Original artifacts/native facts are read while fresh. No publication effect.
on:
  workflow_dispatch:
    inputs:
      original_run_id:
        description: 'Original native publisher run ID for later source proof; never a publish retry'
        required: true
        type: string
  workflow_run:
    workflows: ['Central fleet publish']
    types: [completed]

permissions:
  contents: read

jobs:
  archive:
    if: github.repository == 'jbaruch/coding-policy' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && vars.FLEET_PUBLISHER_ENABLED != 'true') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # fixed create-only central evidence tags, never main
      actions: read # actual completed publisher run/attempt/jobs/artifacts
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Derive historical consumer from original central intent
        if: github.event_name == 'workflow_dispatch'
        id: consumer
        env:
          GH_TOKEN: ${{ github.token }}
          FLEET_CENTRAL_TOKEN: ${{ github.token }}
        run: python3 scripts/fleet_publish_archive_write.py select-consumer
      - uses: actions/create-github-app-token@v3
        if: github.event_name == 'workflow_dispatch' && steps.consumer.outputs.repository_name != ''
        id: app
        with:
          app-id: ${{ secrets.FLEET_APP_ID }}
          private-key: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          owner: jbaruch
          repositories: ${{ steps.consumer.outputs.repository_name }}
          permission-contents: read
          permission-pull-requests: read
      - uses: tesslio/setup-tessl@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          # Renew monthly with the co-shipped package verifier, separately.
          version: '0.119.0'
          token: ${{ secrets.TESSL_TOKEN }} # existing central secret; read/install/pack only
      - name: Archive actual completed publisher evidence
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          FLEET_CENTRAL_TOKEN: ${{ github.token }}
        run: python3 scripts/fleet_publish_archive_write.py
      - name: Attest original public or private historical publication
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          FLEET_CENTRAL_TOKEN: ${{ github.token }}
        run: python3 scripts/fleet_publish_archive_write.py
